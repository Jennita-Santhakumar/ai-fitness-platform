services:
  # --- PostgreSQL Database ---
  - type: pserv
    name: ai-fitness-postgres
    env: docker
    image: postgres:15-alpine
    plan: starter
    envVars:
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: ai_fitness

  # --- Redis Cache & Celery Broker ---
  - type: redis
    name: ai-fitness-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

  # --- FastAPI Backend API ---
  - type: web
    name: ai-fitness-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: ai-fitness-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-fitness-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PROJECT_NAME
        value: AI Fitness Platform
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: USDA_API_KEY
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false

  # --- Celery Background Worker ---
  - type: worker
    name: ai-fitness-worker
    env: docker
    dockerfilePath: ./Dockerfile
    startCommand: celery -A app.worker.celery_app worker --loglevel=warning --concurrency=2
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: ai-fitness-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-fitness-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: ai-fitness-api
          envVarKey: SECRET_KEY
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # --- Celery Beat Scheduler ---
  - type: worker
    name: ai-fitness-beat
    env: docker
    dockerfilePath: ./Dockerfile
    startCommand: celery -A app.worker.celery_app beat --loglevel=warning
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: ai-fitness-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-fitness-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: ai-fitness-api
          envVarKey: SECRET_KEY

  # --- React Frontend (Nginx) ---
  - type: web
    name: ai-fitness-frontend
    env: docker
    dockerContextDir: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
